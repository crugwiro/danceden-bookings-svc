spring.application.name=bookings

spring.datasource.url=jdbc:postgresql://localhost:5432/bookingsdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only verifies its mappings match what
# Flyway created and fails fast on mismatch. Never "update" - see migration files
# under src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate
